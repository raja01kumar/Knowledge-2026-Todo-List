<style>
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border-width: 0;
  }
</style>

<h2 class="sr-only">An interactive to-do list for K26.</h2>

<div style="padding: 1rem 0;">
  <h2 style="font-size: 18px; font-weight: 500; margin: 0 0 1rem; color: var(--color-text-primary);">To-do list for K26</h2>

  <div style="display: flex; gap: 8px; margin-bottom: 0.75rem;">
    <input type="text" id="taskInput" placeholder="Enter a task..." style="flex: 1;" />
    <button id="addBtn">Add</button>
  </div>

  <p id="counter" style="font-size: 13px; color: var(--color-text-secondary); margin: 0 0 1rem;">0 tasks remaining</p>

  <ul id="taskList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;"></ul>
</div>

<script>
  (function () {
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');
    const counter = document.getElementById('counter');

    function updateCounter() {
      const items = taskList.querySelectorAll('li');
      let remaining = 0;
      items.forEach(li => {
        if (li.dataset.completed === 'false') remaining++;
      });
      counter.textContent = remaining + (remaining === 1 ? ' task remaining' : ' tasks remaining');
    }

    function flashInput() {
      taskInput.style.borderColor = 'var(--color-border-danger)';
      taskInput.style.boxShadow = '0 0 0 2px var(--color-background-danger)';
      setTimeout(() => {
        taskInput.style.borderColor = '';
        taskInput.style.boxShadow = '';
      }, 600);
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) {
        flashInput();
        return;
      }

      const li = document.createElement('li');
      li.dataset.completed = 'false';
      li.style.cssText = 'background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer;';

      const span = document.createElement('span');
      span.textContent = text;
      span.style.cssText = 'flex: 1; font-size: 14px; color: var(--color-text-primary);';

      li.addEventListener('click', () => {
        const isCompleted = li.dataset.completed === 'true';
        li.dataset.completed = isCompleted ? 'false' : 'true';
        if (!isCompleted) {
          span.style.textDecoration = 'line-through';
          span.style.color = 'var(--color-text-tertiary)';
        } else {
          span.style.textDecoration = 'none';
          span.style.color = 'var(--color-text-primary)';
        }
        updateCounter();
      });

      li.appendChild(span);
      taskList.appendChild(li);

      taskInput.value = '';
      taskInput.focus();
      updateCounter();
    }

    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });
  })();
</script>
